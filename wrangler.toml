name = "cursor-list-draft"
# Production deploys from GitHub `main`.
compatibility_date = "2026-09-18"
main = "worker.js"
preview_urls = true

# Cloudflare Workers Builds often runs only the deploy command.
# Build dist here so `npx wrangler deploy` does not look for a missing folder.
[build]
command = "npm run build"

# Vite output. SPA fallback so /?c= and /?day= still hit index.html.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "list-draft"
database_id = "4b2e0645-fd53-49b1-b66e-2751617359f1"
